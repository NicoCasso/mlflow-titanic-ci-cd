name: Run Tests on Push

on: 
  push:
    branches:
      - develop_ubuntu

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest
        run: pytest -v --tb=no --junitxml=pytest-report.xml