name: CD Nico
run-name: Déploiement déclenché par CI Nico

on:
  workflow_run:
    workflows: ["CI Nico"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Déploiement (exemple)
        run: |
          echo "Déploiement en cours..."
          ./deploy.sh  # Remplace ceci par ton vrai script de déploiement