name: CD - Build and Test Docker

on:
  push:
    branches: [ wael ]
    tags:
      - 'v*'  # déploiement production sur tag (ex: v1.0.0)

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t titanic-model:latest .

      - name: Run tests with pytest inside Docker
        run: |
          docker run --rm titanic-model:latest pytest